name: Build ImmortalWrt for RAX3000Me

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git
      
      - name: Cache dl and ccache
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            immortalwrt/.ccache
          key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('immortalwrt/feeds.conf.default') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-${{ hashFiles('immortalwrt/feeds.conf.default') }}-
            ${{ runner.os }}-openwrt-cache-
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential libncurses-dev python3 python3-pip rsync git \
            unzip bison flex swig device-tree-compiler bc curl wget ccache
      
      - name: Update and install feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Configure Firmware
        run: |
          cd immortalwrt
          rm -rf tmp/
          {
            echo 'CONFIG_TARGET_mediatek=y'
            echo 'CONFIG_TARGET_mediatek_mt7981=y'
            echo 'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_rax3000me=y'
            echo 'CONFIG_CCACHE=y'
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_PACKAGE_luci-base=y'
            echo 'CONFIG_PACKAGE_luci-compat=y'
            echo 'CONFIG_PACKAGE_luci-lib-ipkg=y'
            echo 'CONFIG_PACKAGE_luci-app-firewall=y'
            echo 'CONFIG_PACKAGE_luci-app-opkg=y'
            echo 'CONFIG_PACKAGE_luci-theme-argon=y'
            echo 'CONFIG_PACKAGE_kmod-mt7915e-firmware=y'
            echo 'CONFIG_PACKAGE_mt7981-wo-firmware=y'
            echo 'CONFIG_PACKAGE_irqbalance=y'
            echo 'CONFIG_PACKAGE_sqm-scripts=y'
            echo 'CONFIG_PACKAGE_luci-app-sqm=y'
            echo 'CONFIG_PACKAGE_luci-app-ttyd=y'
            echo 'CONFIG_PACKAGE_curl=y'
            echo 'CONFIG_PACKAGE_wget-ssl=y'
            echo 'CONFIG_PACKAGE_htop=y'
            echo 'CONFIG_PACKAGE_nano=y'
            echo 'CONFIG_PACKAGE_tcpdump=y'
            echo 'CONFIG_PACKAGE_iperf3=y'
          } > .config
          make defconfig
      
      - name: Download packages
        run: |
          cd immortalwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
      
      - name: Compile Firmware
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s
      
      - name: Organize artifacts
        run: |
          mkdir -p /tmp/firmware-output
          cd immortalwrt/bin/targets/mediatek/mt7981/
          
          cp *sysupgrade* /tmp/firmware-output/ 2>/dev/null || true
          cp *factory* /tmp/firmware-output/ 2>/dev/null || true
          cp *initramfs* /tmp/firmware-output/ 2>/dev/null || true
          cp *preloader* /tmp/firmware-output/ 2>/dev/null || true
          cp *fip* /tmp/firmware-output/ 2>/dev/null || true
          
          echo "=== Built Firmware Files ==="
          ls -lh /tmp/firmware-output/
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-RAX3000Me-NAND-Firmware
          path: /tmp/firmware-output/
          if-no-files-found: error
