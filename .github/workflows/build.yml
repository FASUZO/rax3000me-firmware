name: Build ImmortalWrt for RAX3000Me

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential libncurses-dev python3 python3-pip rsync git \
            unzip bison flex swig device-tree-compiler bc
      
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git
      
      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Configure
        run: |
          cd immortalwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-ipkg=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_kmod-mt7915e-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          EOF
          make defconfig
      
      - name: Build
        run: |
          cd immortalwrt
          make -j$(nproc)
      
      - name: Prepare artifacts
        run: |
          cd immortalwrt
          echo "=== Searching for firmware files ==="
          find bin -name "*.bin" -o -name "*.itb" 2>/dev/null
          echo "=== Target directory ==="
          ls -la bin/targets/mediatek/mt7981/ 2>/dev/null || echo "mt7981 directory not found"
          echo "=== All target directories ==="
          find bin/targets -maxdepth 3 -type d 2>/dev/null
          echo "=== Copying files to output ==="
          mkdir -p /tmp/firmware-output
          find bin/targets -name "*rax3000m*" -o -name "*nand*preloader*" -o -name "*nand*fip*" -o -name "*squashfs*" -o -name "*initramfs*" 2>/dev/null | while read f; do
            cp "$f" /tmp/firmware-output/
            echo "Copied: $f"
          done
          echo "=== Output files ==="
          ls -la /tmp/firmware-output/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000Me-firmware
          path: /tmp/firmware-output/*
          if-no-files-found: warn
