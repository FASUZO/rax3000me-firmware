name: Build ImmortalWrt for RAX3000Me

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential libncurses-dev python3 python3-pip rsync git \
            unzip bison flex swig device-tree-compiler bc
      
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git
      
      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Configure
        run: |
          cd immortalwrt
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_mt7981=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"
            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_luci-base=y"
            echo "CONFIG_PACKAGE_luci-compat=y"
            echo "CONFIG_PACKAGE_luci-lib-ipkg=y"
            echo "CONFIG_PACKAGE_luci-app-firewall=y"
            echo "CONFIG_PACKAGE_luci-app-opkg=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_kmod-mt7915e-firmware=y"
            echo "CONFIG_PACKAGE_mt7981-wo-firmware=y"
            echo "CONFIG_PACKAGE_irqbalance=y"
            echo "CONFIG_PACKAGE_sqm-scripts=y"
            echo "CONFIG_PACKAGE_luci-app-sqm=y"
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_wget-ssl=y"
            echo "CONFIG_PACKAGE_htop=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_tcpdump=y"
            echo "CONFIG_PACKAGE_iperf3=y"
          } > .config
          make defconfig
      
      - name: Build
        run: |
          cd immortalwrt
          make -j$(nproc)
      
      - name: Prepare artifacts
        run: |
          cd immortalwrt
          echo "=== Build output ==="
          ls -la bin/targets/ 2>/dev/null || echo "No targets directory"
          echo "=== Find all firmware files ==="
          find bin -name "*.bin" -o -name "*.itb" 2>/dev/null || echo "No firmware files found"
          echo "=== Copy to output ==="
          mkdir -p /tmp/firmware-output
          find bin -name "*nand*" -o -name "*squashfs*" -o -name "*initramfs*" 2>/dev/null | head -20 | while read f; do
            cp "$f" /tmp/firmware-output/ 2>/dev/null && echo "Copied: $f"
          done
          echo "=== Output ==="
          ls -la /tmp/firmware-output/ 2>/dev/null || echo "No output files"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000Me-firmware
          path: /tmp/firmware-output/*
          if-no-files-found: warn
