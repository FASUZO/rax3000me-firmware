name: Build ImmortalWrt for RAX3000Me

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential libncurses-dev python3 python3-pip rsync git \
            unzip bison flex swig device-tree-compiler bc
      
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git
      
      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Configure
        run: |
          cd immortalwrt
          cat > .config << 'EOF'
          # Target
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          
          # LuCI 界面
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-ipkg=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-theme-argon=y
          
          # WiFi 固件
          CONFIG_PACKAGE_kmod-mt7915e-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          
          # 性能优化
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          
          # 网络工具
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          
          # 移除不需要的服务
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_dnsmasq-full is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_luci-app-ddns is not set
          # CONFIG_PACKAGE_luci-app-vlmcsd is not set
          # CONFIG_PACKAGE_luci-app-zerotier is not set
          # CONFIG_PACKAGE_luci-app-wol is not set
          # CONFIG_PACKAGE_luci-app-nlbwmon is not set
          # CONFIG_PACKAGE_luci-app-adblock is not set
          # CONFIG_PACKAGE_luci-app-commands is not set
          # CONFIG_PACKAGE_luci-app-upnp is not set
          EOF
          make defconfig
      
      - name: Build
        run: |
          cd immortalwrt
          make -j$(nproc)
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000Me-firmware
          path: |
            immortalwrt/bin/targets/mediatek/mt7981/*.bin
            immortalwrt/bin/targets/mediatek/mt7981/*.itb
            immortalwrt/bin/targets/mediatek/mt7981/*.manifest
